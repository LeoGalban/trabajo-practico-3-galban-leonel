<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball Characters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Personajes de Dragon Ball</h1>
        <!-- Barra de búsqueda -->
<div class="row justify-content-center mb-4">
    <div class="col-md-8">
        <div class="input-group">
            <input type="text" id="searchInput" class="form-control" placeholder="Buscar personaje...">
            <button id="searchButton" class="btn btn-primary">Buscar</button>
        </div>
    </div>
</div>

<!-- Mensajes de estado -->
<div id="messageContainer" class="text-center mb-4"></div>

<!-- Contenedor de resultados -->
<div id="resultsContainer" class="row"></div>

<!-- Spinner de carga -->
<div id="loadingSpinner" class="text-center my-4 d-none">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
    </div>
</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
